[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rankcover"
version = "2.0.0"
description = "Confidence-certified adaptive conformal prediction sets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "openml>=0.14",
  "tabulate>=0.9",
]

[project.optional-dependencies]
trees = [
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "catboost>=1.2",
]
foundation = [
  "tabicl",
  "tabpfn",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["rankcover*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
